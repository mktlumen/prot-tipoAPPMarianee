<style>
:root{--paper:#F8EFE6;--line:#EEDFD3;--margin:#E9B1B5;--rose:#B5574F;--rose-dk:#94443D;--marker:#E7B65A;--ink:#5A2E2A;--soft:#86625C;--card:#fff;--tile:#F3E3D8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Karla,system-ui,sans-serif;color:var(--ink);background:var(--paper);
  min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:20px 16px 110px;position:relative}
h1,h2,h3,.hand{font-family:'Young Serif',serif;font-weight:600;margin:0;color:var(--ink)}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;margin:24px 0 10px}
.sub{color:var(--soft);font-size:14px;margin:4px 0 0}
mark{background:none;color:var(--rose)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand small{font-family:'Young Serif',serif;color:var(--rose);font-size:15px}
.card{background:var(--card);border-radius:18px;border:1px solid var(--line);position:relative;overflow:hidden}
.card.notebook{padding:16px}
.card.notebook::before{content:none}
.people{margin-top:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.people label{font-weight:600;font-size:15px;line-height:1.25}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--rose);background:#fff;color:var(--rose);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper output{min-width:34px;text-align:center;font-family:'Young Serif',serif;font-size:26px;font-weight:700}
.day{margin-bottom:10px}
.day h3{font-size:19px;color:var(--rose);margin-bottom:4px}
.day.today h3::after{content:" · hoje";color:var(--soft);font-family:Karla,sans-serif;font-size:13px;font-weight:600}
.meal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #F0E3D6}
.meal:first-of-type{border-top:0}
.meal .tag{font-size:11px;font-weight:700;color:var(--soft);width:52px;flex:none}

.big{display:block;width:100%;margin:18px 0 6px;padding:16px;border:0;border-radius:14px;background:var(--rose);color:#fff;font:700 17px Karla,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--rose-dk)}

.search{width:100%;padding:13px 14px;border:2px solid #E6D5C8;border-radius:12px;font:16px Karla,sans-serif;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid #E6D5C8;background:#fff;border-radius:999px;padding:8px 14px;font:600 14px Karla,sans-serif;color:var(--ink);cursor:pointer}

.rlist{display:grid;gap:10px;margin-top:10px}
.rcard{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;width:100%}
.rcard .info{flex:1}
.rcard .name{font-weight:700;font-size:16px}
.rcard .meta{font-size:13px;color:var(--soft);margin-top:2px}
.badge{display:inline-block;background:#F6E3B8;color:#6E4A12;font:600 11.5px Karla,sans-serif;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.miss{font-size:12.5px;font-weight:600;color:var(--rose)}
.miss.ok{color:#2E7D4F}
.heart{font-size:20px;color:var(--rose);flex:none}
.shop-sec{margin-top:14px}
.shop-sec h3{font-size:18px;color:var(--rose);margin-bottom:4px}
.check{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px dashed #F0E3D6;cursor:pointer;font-size:15px}
.check:first-of-type{border-top:0}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:2px solid #D9C3B8;border-radius:6px;margin:0;display:grid;place-content:center;background:#fff;cursor:pointer}
.check input:checked{background:var(--rose);border-color:var(--rose)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{text-decoration:line-through;color:#B39C95}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.link{background:none;border:0;color:var(--rose);font:700 15px Karla,sans-serif;cursor:pointer;padding:6px 0}
.back{background:none;border:0;color:var(--soft);font:600 15px Karla,sans-serif;cursor:pointer;padding:4px 0;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:10px}
.ing{border:2px solid #E6D5C8;background:#fff;border-radius:12px;padding:12px 6px;font:600 14px Karla,sans-serif;color:var(--ink);cursor:pointer;text-align:center}
.ing[aria-pressed="true"]{border-color:var(--rose);background:#F8E4DF;color:var(--rose-dk)}
.empty{padding:24px 18px;text-align:center;color:var(--soft);font-size:15px}
.empty .hand{font-size:22px;color:var(--ink);display:block;margin-bottom:6px}
footer{text-align:center;font-family:'Young Serif',serif;color:var(--soft);font-size:14px;margin:26px 0 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #EBDCCF;display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:35}
nav.tabs .in{display:flex;width:100%;max-width:480px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;font:600 12px Karla,sans-serif;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--rose)}
/* recipe sheet */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:30;overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
.sheet .app{padding-bottom:110px}
.rtitle{font-size:30px;line-height:1.1;margin-top:4px}
.rmeta{color:var(--soft);font-size:14px;margin-top:6px}
.fav{border:2px solid var(--rose);background:#fff;color:var(--rose);border-radius:999px;padding:8px 14px;font:700 14px Karla,sans-serif;cursor:pointer;flex:none}
.fav[aria-pressed="true"]{background:var(--rose);color:#fff}
.steps{margin:0;padding:0 0 0 4px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0;font-size:15.5px;line-height:1.45}
.steps li::before{content:counter(s);font-family:'Young Serif',serif;font-weight:700;font-size:22px;color:var(--rose);width:20px;flex:none;line-height:1.1}
.tip{margin-top:18px;padding:14px 16px;background:var(--marker);border-radius:4px 14px 14px 14px;transform:rotate(-.6deg);box-shadow:0 4px 12px -8px rgba(0,0,0,.4)}
.tip b{font-family:'Young Serif',serif;font-size:18px;display:block}
.freeze{margin-top:14px;padding:14px 16px;background:#FBF0D6;border:1.5px solid #EED9A2;border-radius:14px}
.freeze b{font-family:'Young Serif',serif;font-size:18px;display:block;color:#8A5A1E}
.badge.ice{background:#E9EEF0;color:#3F5A66}
.badge.pos{background:#F8E1DC;color:var(--rose-dk)}
.pos-intro{margin-top:10px}
.pos-intro .hand{font-size:19px;color:var(--rose)}
.pos-intro p{margin:6px 0 0;font-size:14.5px;line-height:1.45}
.pos-intro p.small{font-size:12.5px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font:600 14px Karla,sans-serif;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{font-size:12.5px;color:var(--soft);background:#fff;border:1px dashed #E6D5C8;border-radius:10px;padding:8px 10px;margin-top:12px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qbtn{border:0;text-align:left;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.qbtn b{display:block;font-size:14.5px}.qbtn span{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.hcard{margin-top:14px}.hcard h3{font-size:19px;margin-bottom:2px}
.hcard .hint{font-size:13.5px;color:var(--soft);margin:0 0 8px}
.go{display:inline-block;margin-top:8px;background:none;border:0;color:var(--rose);font:700 14.5px Karla,sans-serif;cursor:pointer;padding:4px 0}
.dots{display:flex;gap:6px;margin:6px 0 2px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose)}.dots i.on{background:var(--rose)}
.remind{background:#FBF0D6;border:1.5px solid #EED9A2;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.myst{margin-top:12px}.myst.done{background:#FDF4F0}
.myst .when{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.02em}
.myst h3{font-size:18px;margin:2px 0 8px;line-height:1.25}
.beads{display:flex;gap:6px;flex-wrap:wrap}
.bead{width:26px;height:26px;border-radius:50%;border:2px solid #E2B8B2;background:#fff;cursor:pointer;padding:0}
.bead.on{background:var(--rose);border-color:var(--rose)}
.mbtn{margin-top:10px;border:2px solid var(--rose);background:#fff;color:var(--rose);border-radius:999px;padding:7px 14px;font:700 13.5px Karla,sans-serif;cursor:pointer}
.myst.done .mbtn{background:var(--rose);color:#fff}
.banner{margin-top:14px;padding:16px;text-align:center;background:var(--marker);border-radius:14px;font-family:'Young Serif',serif;font-size:22px;font-weight:700}
.daybig{font-family:'Young Serif',serif;font-size:26px;font-weight:700;color:var(--rose);line-height:1.1}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:14px;font-weight:600;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.switch i{width:42px;height:24px;border-radius:999px;background:#E6D5C8;position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.switch[aria-pressed="true"] i{background:var(--rose)}.switch[aria-pressed="true"] i::after{left:21px}
.week{font-size:14px}.week div{display:flex;gap:10px;padding:6px 0;border-top:1px dashed #F0E3D6}.week div:first-child{border-top:0}
.week b{width:64px;flex:none}.week .now{color:var(--rose)}
.kid{margin-top:12px}.kid h3{font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.kid h3 small{font-family:Karla,sans-serif;font-size:12.5px;color:var(--soft);font-weight:600}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #F0E3D6;font-size:14.5px}
.task:first-of-type{border-top:0}
.star{display:grid;place-items:center;padding:0;flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #e6cf6b;background:#fff;font-size:18px;line-height:1;cursor:pointer;color:#d6b52c}
.star.on{background:var(--marker);border-color:#d6b52c;color:var(--ink)}
.addkid{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addkid input,.addkid select{flex:1;min-width:120px;padding:11px 12px;border:2px solid #E6D5C8;border-radius:12px;font:15px Karla,sans-serif;background:#fff;color:var(--ink)}
.addkid button{padding:11px 16px;border:0;border-radius:12px;background:var(--rose);color:#fff;font:700 15px Karla,sans-serif;cursor:pointer}
.del{background:none;border:0;color:var(--soft);font:600 12.5px Karla,sans-serif;cursor:pointer;text-decoration:underline}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin:-6px 0 14px}
.tb-sp{width:44px}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:4px}
.brandmark img{display:block;width:170px;height:auto}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:50%}
.hero{position:relative;background:linear-gradient(135deg,#9C6A55,#7B4C3D);border-radius:20px;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:180px;overflow:hidden}
.hero img{width:100%;height:180px;object-fit:cover;object-position:50% 70%;display:block}
.hero p{margin:0;padding:18px 16px;font-family:'Young Serif',serif;font-size:21px;line-height:1.3;color:#F8EFE6}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--tile);border:0;border-radius:16px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--rose);cursor:pointer;font:500 13.5px Karla,sans-serif}
.tile span{color:var(--ink)}
.tile:active{background:#EBD6C8}
h2 .dt{font-family:Karla,sans-serif;font-style:normal;font-size:13px;color:var(--soft);font-weight:400;display:block;margin-top:2px}

/* Young Serif tem um peso só: sem negrito falso */
h1,h2,h3,.hand,.stepper output,.steps li::before,.tip b,.freeze b,.banner,.daybig,.hero p,footer,.brand small{font-weight:400!important;font-synthesis:none;letter-spacing:-.01em}
h1{font-size:29px}
.tile svg{width:38px;height:38px}
.ico{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
nav.tabs button[aria-current="page"] svg .fillme{fill:currentColor;fill-opacity:.18}
button:focus-visible,input:focus-visible{outline:3px solid #C86F66;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+'-'+Math.ceil(((d-y)/864e5+1)/7)}
const SEMANA=isoWeek(new Date());
function rng(seed){let h=1779033703;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const POOL={almoco:RECEITAS.filter(r=>r.cat==='Almoço'||r.cat==='Marmita').map(r=>r.id),jantar:RECEITAS.filter(r=>r.cat==='Jantar').map(r=>r.id)};

function cardapioBase(){const r=rng('mari-'+SEMANA);const out={};
  for(const k of ['almoco','jantar']){let fila=[];for(let d=0;d<7;d++){if(!fila.length)fila=shuffle(POOL[k],r);out[d+'-'+k]=fila.shift()}}return out}
function cardapio(){return Object.assign(cardapioBase(),store.get('trocas-'+SEMANA,{}))}
function trocar(slot){const k=slot.split('-')[1];const atual=cardapio();const usados=new Set(Object.values(atual));
  let op=POOL[k].filter(id=>!usados.has(id));if(!op.length)op=POOL[k].filter(id=>id!==atual[slot]);
  const novo=op[Math.floor(Math.random()*op.length)];const t=store.get('trocas-'+SEMANA,{});t[slot]=novo;store.set('trocas-'+SEMANA,t);
  store.set('lista-'+SEMANA,[]);render();toast('Trocado por '+BY[novo].nome)}

const INT_UNITS=new Set(['','lata','sachê','caixinha','tablete','dente']);
const PLURAL={'xícara':'xícaras','colher de sopa':'colheres de sopa','lata':'latas','sachê':'sachês','caixinha':'caixinhas','tablete':'tabletes','dente':'dentes'};
function frac(x){const w=Math.floor(x),f=x-w;const map={0.25:'1/4',0.5:'1/2',0.75:'3/4'};const fs=map[f]||'';return w&&fs?w+' e '+fs:(w?String(w):fs)}
function qtd(nome,q,u,plural){
  if(u==='a gosto')return nome.charAt(0).toUpperCase()+nome.slice(1)+' a gosto';
  if(u==='g'){if(q>=1000){const kg=Math.round(q/250)/4;return String(kg).replace('.',',')+' kg de '+nome}return Math.max(50,Math.round(q/50)*50)+' g de '+nome}
  if(INT_UNITS.has(u)){const n=Math.max(1,Math.round(q));if(u==='')return n+' '+(n>1?(plural||nome):nome);return n+' '+(n>1?PLURAL[u]:u)+' de '+nome}
  const step=q<1?0.25:0.5;const r=Math.max(0.25,Math.round(q/step)*step);const many=r>=2;return frac(r)+' '+(many?(PLURAL[u]||u):u)+' de '+nome}

function montarLista(){const c=cardapio();const tot={};

  if(!tot[key])tot[key]={nome,u,sec,pl,q:0};tot[key].q+=q*fator()}}

 if(!temSel.size)return h+'<div class="empty"><span class="hand">O que tem aí?</span>Marque pelo menos um ingrediente pra ver o que dá pra fazer.</div>'+rodape;

 3.9 1.4-8.3-6-5.9 8.3-1.2z" fill="#E7B65A" stroke="#C86F66" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="15.5" r="2.2" fill="#C86F66"/></svg><span>Tarefinhas</span></button><button class="tile" data-go=\"terco\"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16.0" cy="3.5" r="1.9" fill="#C86F66"/><circle cx="20.2" cy="4.6" r="1.9" fill="#C86F66"/><circle cx="23.4" cy="7.7" r="1.9" fill="#C86F66"/><circle cx="24.5" cy="12.0" r="1.9" fill="#C86F66"/><circle cx="23.4" cy="16.3" r="1.9" fill="#C86F66"/><circle cx="8.6" cy="16.2" r="1.9" fill="#C86F66"/><circle cx="7.5" cy="12.0" r="1.9" fill="#C86F66"/><circle cx="8.6" cy="7.7" r="1.9" fill="#C86F66"/><circle cx="11.8" cy="4.6" r="1.9" fill="#C86F66"/><circle cx="16" cy="21.5" r="2.4" fill="#C86F66"/><path d="M16 23.5v6M13 26.3h6" stroke="#E7B65A" stroke-width="2.6" stroke-linecap="round"/></svg><span>Terço</span></button></div><h2>${saud}! <span class="dt">${data}</span></h2>
 <div class="card notebook hcard"><h3>Terço do dia</h3><p class="hint">Mistérios ${MIST_DIA} · ${feitos} de 5</p><div class="dots">${t.map(x=>`<i class="${x>=10?'on':''}"></i>`).join('')}</div>
 <button class="go" data-go="terco">${feitos===5?'Terço completo':feitos?'Rezar o '+ORD[t.findIndex(x=>x<10)]+' mistério →':'Começar o 1º mistério →'}</button></div>
 <div class="card notebook hcard"><h3>Comida de hoje</h3>
 ${['almoco','jantar'].map((k,i)=>{const r=BY[c[idxSemana+'-'+k]];return `<div class="meal"><span class="tag">${i?'JANTAR':'ALMOÇO'}</span><button class="open" data-rec="${r.id}"><span class="name">${esc(r.nome)}</span><span class="time">${r.tempo} min</span></button></div>`}).join('')}
 ${cong.length&&idxSemana<6?`<div class="remind">Amanhã tem <b>${cong.map(r=>esc(r.nome)).join(' e ')}</b>. Se já estiver congelado, tire hoje à noite.</div>`:''}
 <button class="go" data-go="semana">Ver a semana →</button></div>
 <div class="card notebook hcard"><h3>Casa: ${L.foco}</h3><p class="hint">${ld} de ${lt.length} tarefas${rap?' (versão 15 min)':''}</p><button class="go" data-go="casa">Ir pra limpeza de hoje →</button></div>`;
 const kids=store.get('kids',[]);
 if(kids.length){h+=`<div class="card notebook hcard"><h3>Tarefinhas</h3>${kids.map((k,ki)=>`<p class="hint" style="margin:2px 0">${esc(k.nome)}: ${setOf('stars-'+HOJE+'-'+ki).size} de ${FAIXAS[k.faixa].t.length} estrelas</p>`).join('')}<button class="go" data-act="vertarefas">Ver quadro →</button></div>`}
 return h+rodape}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){fecharSeAberto();return ir(b.dataset.tab)}
 if(b.dataset.go)return ir(b.dataset.go);
 if(b.dataset.rec)return abrirReceita(b.dataset.rec);
 if(b.dataset.swap)return trocar(b.dataset.swap);
 if(b.dataset.cat){filtroCat=b.dataset.cat;return render()}
 if(b.dataset.tag){const t=b.dataset.tag;temSel.has(t)?temSel.delete(t):temSel.add(t);store.set('tem',[...temSel]);return render()}
 if(b.dataset.fav){const id=b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);store.set('favs',[...favs]);toast(favs.has(id)?'Salva nas favoritas':'Removida das favoritas');return abrirReceita(id)}

 if(b.dataset.casa){casaSub=b.dataset.casa;return render()}
 if(b.dataset.rot){rotSel=b.dataset.rot;return render()}
 if(b.dataset.bead){const [m,i]=b.dataset.bead.split('|').map(Number);const t=terco();t[m]=(t[m]===i+1)?i:i+1;store.set(tercoKey,t);if(tercoFeitos()===5)toast('Terço completo!');return render()}
 if(b.dataset.mist){const m=+b.dataset.mist;const t=terco();t[m]=t[m]>=10?0:10;store.set(tercoKey,t);toast(t[m]?ORD[m]+' mistério rezado':'Desmarcado');return render()}
 if(b.dataset.star){const [k,ti]=b.dataset.star.split('|');const key='stars-'+HOJE+'-'+k;const st=setOf(key);st.has(+ti)?st.delete(+ti):st.add(+ti);store.set(key,[...st]);return render()}
 if(b.dataset.delkid){const kids=store.get('kids',[]);kids.splice(+b.dataset.delkid,1);store.set('kids',kids);return render()}
 const a=b.dataset.act;
 if(a==='mais'||a==='menos'){pessoas=Math.min(12,Math.max(2,pessoas+(a==='mais'?1:-1)));store.set('pessoas',pessoas);
   const open=$('#sheet').dataset.rec;if(open){abrirReceita(open);render()}else render();return}
 if(a==='fechar')return fecharReceita();
 if(a==='buscar'){ir('receitas');const n=$('#busca');if(n)n.focus();return}
 if(a==='rapido'){store.set('rapido-'+HOJE,!store.get('rapido-'+HOJE,false));return render()}
 if(a==='vertarefas'){casaSub='criancas';return ir('casa')}
 if(a==='addkid'){const n=$('#kidName').value.trim();if(!n){$('#kidName').focus();return}const kids=store.get('kids',[]);kids.push({nome:n,faixa:$('#kidFaixa').value});store.set('kids',kids);toast(n+' entrou no quadro');return render()}
 if(a==='limpar'){store.set('lista-'+SEMANA,[]);return render()}
 if(a==='copiar'){const porSec=montarLista();let txt='Lista de compras da semana (Casa da Mari), pra '+pessoas+' pessoas\n';
   for(const s of SECOES){if(!porSec[s])continue;txt+='\n*'+s+'*\n'+porSec[s].map(it=>'- '+qtd(it.nome,it.q,it.u,it.pl)).join('\n')+'\n'}
   const ok=()=>toast('Lista copiada');
   try{navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt))}catch(err){fallbackCopy(txt)}}
});
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'Lista copiada':'Não deu pra copiar aqui')}
function fecharSeAberto(){if($('#sheet').classList.contains('open')){$('#sheet').classList.remove('open');delete $('#sheet').dataset.rec}}
document.addEventListener('change',e=>{const i=e.target;
 if(i.dataset.chk){const [key,idx]=i.dataset.chk.split('::');const st=setOf(key);i.checked?st.add(+idx):st.delete(+idx);store.set(key,[...st])}
 if(i.dataset.item){const s=new Set(store.get('lista-'+SEMANA,[]));i.checked?s.add(i.dataset.item):s.delete(i.dataset.item);store.set('lista-'+SEMANA,[...s])}
 if(i.dataset.ing){const [id,idx]=i.dataset.ing.split('|');const s=new Set(store.get('ing-'+id,[]));i.checked?s.add(+idx):s.delete(+idx);store.set('ing-'+id,[...s])}});
document.addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;const pos=e.target.selectionStart;render();const n=$('#busca');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open'))fecharReceita()});
render();
</script>
